<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifeXP">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Life XP</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #09090f, #17172b);
    color: white;
    min-height: 100vh;
}
.container { width: 90%; max-width: 650px; margin: auto; padding: 30px 0; }
h1 { text-align: center; font-size: 42px; margin-bottom: 5px; }
h2 { margin-top: 0; }
.subtitle { text-align: center; color: #9ca3af; }
.card {
    background: #1f1f35;
    border-radius: 20px;
    padding: 25px;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
}
.level { text-align: center; font-size: 35px; font-weight: bold; color: #a78bfa; }
.xp-text { text-align: center; color: #cbd5e1; }
.progress {
    width: 100%; height: 20px; background: #111827;
    border-radius: 20px; overflow: hidden; margin-top: 15px;
}
.progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #7c3aed, #22d3ee);
    transition: width .4s;
}
.task {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: #292945; padding: 15px;
    margin-top: 12px; border-radius: 14px;
}
.task-info { font-size: 17px; }
.task-xp { color: #22d3ee; font-weight: bold; margin-right: 8px; }
button {
    border: none; background: #7c3aed; color: white;
    padding: 10px 15px; border-radius: 10px; cursor: pointer;
    font-weight: bold;
}
button:hover { background: #8b5cf6; }
button:disabled { background: #4b5563; cursor: not-allowed; }
.reset { width: 100%; margin-top: 20px; background: #dc2626; }
.secondary { background: #374151; }
.form-row { display: flex; gap: 8px; margin-top: 12px; }
input {
    flex: 1; min-width: 0; padding: 12px;
    border: 1px solid #4b5563; border-radius: 10px;
    background: #111827; color: white; outline: none;
}
input:focus { border-color: #8b5cf6; }
.form-row input[type="number"] { max-width: 110px; }
.achievement {
    background: #292945; padding: 12px; border-radius: 12px;
    margin-top: 10px; opacity: .45;
}
.achievement.unlocked { opacity: 1; border: 1px solid #22d3ee; }
.small { color: #9ca3af; font-size: 13px; }
.streak {
    text-align: center; font-size: 24px; margin-top: 10px;
    color: #fb923c;
}
.empty { color: #9ca3af; text-align: center; padding: 15px 0; }
.toast {
    position: fixed; left: 50%; bottom: 25px;
    transform: translateX(-50%) translateY(100px);
    background: #111827; border: 1px solid #7c3aed;
    padding: 14px 20px; border-radius: 14px;
    transition: transform .3s; z-index: 10;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

<body>
<div class="container">
    <h1>⚡ LIFE XP</h1>
    <div class="subtitle">Turn your real life into a game.</div>

    <div class="card">
        <div class="level">LEVEL <span id="level">1</span></div>
        <p class="xp-text">
            <span id="xp">0</span> / <span id="nextXP">500</span> XP
        </p>
        <div class="progress">
            <div class="progress-bar" id="progress"></div>
        </div>
        <div class="streak">🔥 <span id="streak">0</span> day streak</div>
    </div>

    <div class="card">
        <h2>🎯 Daily Quests</h2>
        <div id="taskList"></div>
    </div>

    <div class="card">
        <h2>➕ Add a Quest</h2>
        <div class="form-row">
            <input id="taskName" type="text" placeholder="Example: Read 20 minutes">
            <input id="taskXP" type="number" min="1" max="1000" value="50">
            <button onclick="addTask()">Add</button>
        </div>
        <p class="small">Choose how much XP the quest is worth.</p>
    </div>

    <div class="card">
        <h2>🏆 Achievements</h2>
        <div id="achievementList"></div>
    </div>

    <div class="card">
        <h2>📊 Stats</h2>
        <p>Quests completed: <b id="quests">0</b></p>
        <p>Total XP earned: <b id="totalXP">0</b></p>
        <button class="reset" onclick="resetGame()">Reset Progress</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const DEFAULT_TASKS = [
    { id: "study", name: "📚 Study", xp: 50 },
    { id: "exercise", name: "🏃 Exercise", xp: 100 },
    { id: "clean", name: "🧹 Clean Room", xp: 40 },
    { id: "water", name: "💧 Drink Water", xp: 20 },
    { id: "sleep", name: "😴 Sleep 8 Hours", xp: 100 }
];

const ACHIEVEMENTS = [
    { id: "first", icon: "⭐", name: "First Quest", description: "Complete your first quest", check: s => s.quests >= 1 },
    { id: "streak3", icon: "🔥", name: "On Fire", description: "Reach a 3 day streak", check: s => s.streak >= 3 },
    { id: "level5", icon: "⚔️", name: "Level 5", description: "Reach level 5", check: s => s.xp >= 2000 },
    { id: "xp5000", icon: "💎", name: "XP Collector", description: "Earn 5,000 total XP", check: s => s.xp >= 5000 },
    { id: "level10", icon: "👑", name: "Level 10", description: "Reach level 10", check: s => s.xp >= 4500 }
];

let xp = Number(localStorage.getItem("lifeXP")) || 0;
let quests = Number(localStorage.getItem("quests")) || 0;
let streak = Number(localStorage.getItem("lifeXPStreak")) || 0;
let lastCompletedDate = localStorage.getItem("lifeXPLastDate") || "";
let tasks = JSON.parse(localStorage.getItem("lifeXPTasks") || "null") || DEFAULT_TASKS.map(t => ({...t}));
let completedToday = JSON.parse(localStorage.getItem("lifeXPCompletedToday") || "[]");

function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function yesterdayKey() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function checkNewDay() {
    const today = todayKey();
    if (localStorage.getItem("lifeXPLastOpened") !== today) {
        completedToday = [];
        localStorage.setItem("lifeXPLastOpened", today);
        save();
    }
}

function xpNeededForLevel(level) {
    if (level <= 1) return 0;
    return Math.round(500 * Math.pow(level - 1, 1.25));
}

function getLevelInfo() {
    let level = 1;
    while (xp >= xpNeededForLevel(level + 1)) level++;
    const current = xp - xpNeededForLevel(level);
    const needed = xpNeededForLevel(level + 1) - xpNeededForLevel(level);
    return { level, current, needed };
}

function save() {
    localStorage.setItem("lifeXP", xp);
    localStorage.setItem("quests", quests);
    localStorage.setItem("lifeXPStreak", streak);
    localStorage.setItem("lifeXPLastDate", lastCompletedDate);
    localStorage.setItem("lifeXPTasks", JSON.stringify(tasks));
    localStorage.setItem("lifeXPCompletedToday", JSON.stringify(completedToday));
}

function updateGame() {
    checkNewDay();

    const info = getLevelInfo();
    document.getElementById("level").textContent = info.level;
    document.getElementById("xp").textContent = info.current;
    document.getElementById("nextXP").textContent = info.needed;
    document.getElementById("progress").style.width =
        Math.min(100, info.current / info.needed * 100) + "%";

    document.getElementById("quests").textContent = quests;
    document.getElementById("totalXP").textContent = xp;
    document.getElementById("streak").textContent = streak;

    renderTasks();
    renderAchievements();
    save();
}

function renderTasks() {
    const list = document.getElementById("taskList");

    if (!tasks.length) {
        list.innerHTML = '<div class="empty">No quests yet. Add one below!</div>';
        return;
    }

    list.innerHTML = tasks.map(task => {
        const done = completedToday.includes(task.id);
        return `
            <div class="task">
                <div class="task-info">
                    ${escapeHtml(task.name)}
                </div>
                <div>
                    <span class="task-xp">+${task.xp} XP</span>
                    <button ${done ? "disabled" : ""}
                        onclick="completeTask('${task.id}')">
                        ${done ? "✓ Done" : "Complete"}
                    </button>
                </div>
            </div>
        `;
    }).join("");
}

function completeTask(id) {
    if (completedToday.includes(id)) return;

    const task = tasks.find(t => t.id === id);
    if (!task) return;

    const oldLevel = getLevelInfo().level;
    const today = todayKey();

    if (lastCompletedDate !== today) {
        if (lastCompletedDate === yesterdayKey()) {
            streak++;
        } else {
            streak = 1;
        }
        lastCompletedDate = today;
    }

    xp += task.xp;
    quests++;
    completedToday.push(id);
    save();
    updateGame();

    const newLevel = getLevelInfo().level;

    if (newLevel > oldLevel) {
        showToast("🎉 LEVEL UP! You reached Level " + newLevel + "!");
    } else {
        showToast("+" + task.xp + " XP earned! ⚡");
    }
}

function addTask() {
    const nameInput = document.getElementById("taskName");
    const xpInput = document.getElementById("taskXP");

    const name = nameInput.value.trim();
    const amount = Number(xpInput.value);

    if (!name) {
        showToast("Enter a quest name first.");
        return;
    }

    if (!amount || amount < 1 || amount > 1000) {
        showToast("XP must be between 1 and 1000.");
        return;
    }

    tasks.push({
        id: "custom-" + Date.now(),
        name: "🎯 " + name,
        xp: amount
    });

    nameInput.value = "";
    xpInput.value = 50;
    save();
    updateGame();
    showToast("Quest added! 🎯");
}

function renderAchievements() {
    const info = {
        xp,
        quests,
        streak,
        level: getLevelInfo().level
    };

    const unlocked = JSON.parse(localStorage.getItem("lifeXPAchievements") || "[]");

    document.getElementById("achievementList").innerHTML = ACHIEVEMENTS.map(a => {
        const earned = unlocked.includes(a.id) || a.check(info);
        if (earned && !unlocked.includes(a.id)) unlocked.push(a.id);

        return `
            <div class="achievement ${earned ? "unlocked" : ""}">
                ${a.icon} <b>${a.name}</b> — ${a.description}
                ${earned ? " ✓" : ""}
            </div>
        `;
    }).join("");

    localStorage.setItem("lifeXPAchievements", JSON.stringify(unlocked));
}

function resetGame() {
    if (!confirm("Reset all Life XP progress, quests, streak, and custom quests?")) return;

    xp = 0;
    quests = 0;
    streak = 0;
    lastCompletedDate = "";
    tasks = DEFAULT_TASKS.map(t => ({...t}));
    completedToday = [];

    localStorage.removeItem("lifeXPAchievements");
    localStorage.removeItem("lifeXPLastOpened");
    save();
    updateGame();
    showToast("Progress reset.");
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

function escapeHtml(text) {
    return text.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#039;"
    }[char]));
}

checkNewDay();
updateGame();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(err => console.log("Service worker registration failed:", err));
  });
}
</script>
</body>
</html>
